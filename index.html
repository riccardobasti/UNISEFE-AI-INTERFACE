async function open(raw){const value=String(raw??'').trim();if(!value)throw Error('Inserisci un URL o un percorso file');if(/^https?:\/\//i.test(value))return openURL(value);if(/^[a-z][a-z0-9+.-]*:/i.test(value))throw Error('Schema URL non consentito');return openFile(value)}go.onclick=()=>open(address.value).catch(e=>report(e.message));address.onkeydown=e=>{if(e.key==='Enter')go.click()};choose.onclick=()=>picker.click();picker.onchange=()=>{openPicked(picker.files?.[0]).catch(e=>report(e.message)).finally(()=>{picker.value=''})};external.onclick=()=>{try{const c=space.get('viewer/content');window.open(c?.kind==='external'?c.url:urlOf(address.value),'_blank','noopener,noreferrer')}catch(e){report(e.message)}};
app.connectors.register('viewerbrowser',{tools:[{type:'function',function:{name:'viewerbrowser_open',description:'Apri senza autorizzazione aggiuntiva nel Viewer un URL HTTP(S) o un file della cartella. I siti esterni possono bloccare iframe e non sono accessibili all’agente.',parameters:{type:'object',properties:{target:{type:'string',description:'URL HTTP(S) completo o percorso file esatto nella cartella'}},required:['target'],additionalProperties:false}}}],async call(op,args){if(op!=='open')throw Error('Azione non consentita');return open(args?.target)}});
function enable(){const config=space.get('config/core');if(config&&typeof config==='object'&&!Object.hasOwn(config,'viewerbrowser.token'))Object.defineProperty(config,'viewerbrowser.token',{value:'local-only',enumerable:false,configurable:true})}space.on('config/core',enable);enable();window.UNISEFE_VIEWER_BROWSER={open};
})();
